name: Build Sonora Android APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-sonora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Sonora APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out Sonora repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Sonora Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run unit tests (report failures without blocking APK)
        continue-on-error: true
        run: ./gradlew --no-daemon :core:testDebugUnitTest :app:testDebugUnitTest -x :core:checkDebugUnitTestAarMetadata

      - name: Upload Sonora Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
